<div class="category-filter-container">
  @if (loading) {
    <div class="d-flex justify-content-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else {
    <div class="category-buttons">
      <button
        class="category-btn"
        [class.active]="selectedCategory === 'all'"
        (click)="selectCategory('all')">
        🍽️ All
      </button>
      @for (category of categories; track category.strCategory) {
        <button
          class="category-btn"
          [class.active]="selectedCategory === category.strCategory"
          (click)="selectCategory(category.strCategory)">
          <span class="category-icon">{{ getCategoryIcon(category.strCategory) }}</span>
          {{ category.strCategory }}
        </button>
      }
    </div>
  }
</div>
